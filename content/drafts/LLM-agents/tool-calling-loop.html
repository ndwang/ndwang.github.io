<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One agent loop</title>
    <link rel="stylesheet" href="./diagram.css" />
    <script src="./diagram.js" defer></script>
  </head>
  <body>
    <main data-diagram>
      <h1>One agent loop</h1>
      <div class="controls" role="group" aria-label="Action format">
        <button
          type="button"
          data-view="prompted"
          aria-pressed="true"
          aria-controls="prompted-panel"
        >
          Prompted
        </button>
        <button
          type="button"
          data-view="native"
          aria-pressed="false"
          aria-controls="native-panel"
        >
          Native
        </button>
      </div>
      <figure>
        <section
          id="prompted-panel"
          data-panel="prompted"
          aria-label="Prompted action"
        >
          <svg
            class="visual"
            viewBox="0 0 360 394"
            role="img"
            aria-labelledby="prompted-title prompted-desc"
          >
            <title id="prompted-title">
              Prompted action in the same agent loop
            </title>
            <desc id="prompted-desc">
              The model emits an action in a prompted text format. The harness
              runs the tool and includes its result in the next model input. A
              new model generation can request another action or produce an
              answer.
            </desc>
            <defs>
              <marker
                id="prompted-arrow"
                markerWidth="7"
                markerHeight="7"
                refX="6"
                refY="3.5"
                orient="auto"
              >
                <path class="arrow" d="M0 0 L7 3.5 L0 7 Z" />
              </marker>
            </defs>

            <path
              class="edge"
              d="M180 88 V126"
              marker-end="url(#prompted-arrow)"
            />
            <path
              class="edge"
              d="M180 184 V288"
              marker-end="url(#prompted-arrow)"
            />
            <path
              class="edge"
              d="M240 60 H268"
              marker-end="url(#prompted-arrow)"
            />
            <path
              class="edge"
              d="M118 317 H24 V14 H180 V30"
              marker-end="url(#prompted-arrow)"
            />

            <rect
              class="node model"
              x="120"
              y="32"
              width="120"
              height="56"
              rx="10"
            />
            <text class="label" x="180" y="66" text-anchor="middle">Model</text>
            <rect class="node" x="270" y="40" width="80" height="40" rx="8" />
            <text class="label" x="310" y="66" text-anchor="middle">
              Answer
            </text>

            <rect
              class="node model"
              x="68"
              y="128"
              width="224"
              height="56"
              rx="8"
            />
            <text
              class="label"
              x="180"
              y="162"
              text-anchor="middle"
              font-family="monospace"
            >
              Action: search
            </text>

            <rect
              class="boundary"
              x="46"
              y="222"
              width="268"
              height="150"
              rx="14"
            />
            <text class="label" x="66" y="248">Harness</text>
            <rect
              class="node tool"
              x="118"
              y="290"
              width="124"
              height="54"
              rx="10"
            />
            <text class="label" x="180" y="323" text-anchor="middle">Tool</text>
          </svg>
        </section>
        <section
          id="native-panel"
          data-panel="native"
          aria-label="Native tool call"
          hidden
        >
          <svg
            class="visual"
            viewBox="0 0 360 394"
            role="img"
            aria-labelledby="native-title native-desc"
          >
            <title id="native-title">
              Native tool call in the same agent loop
            </title>
            <desc id="native-desc">
              The model emits a structured tool request. The harness runs the
              tool and includes its result in the next model input. A new model
              generation can request another action or produce an answer.
            </desc>
            <defs>
              <marker
                id="native-arrow"
                markerWidth="7"
                markerHeight="7"
                refX="6"
                refY="3.5"
                orient="auto"
              >
                <path class="arrow" d="M0 0 L7 3.5 L0 7 Z" />
              </marker>
            </defs>

            <path
              class="edge"
              d="M180 88 V126"
              marker-end="url(#native-arrow)"
            />
            <path
              class="edge"
              d="M180 184 V288"
              marker-end="url(#native-arrow)"
            />
            <path
              class="edge"
              d="M240 60 H268"
              marker-end="url(#native-arrow)"
            />
            <path
              class="edge"
              d="M118 317 H24 V14 H180 V30"
              marker-end="url(#native-arrow)"
            />

            <rect
              class="node model"
              x="120"
              y="32"
              width="120"
              height="56"
              rx="10"
            />
            <text class="label" x="180" y="66" text-anchor="middle">Model</text>
            <rect class="node" x="270" y="40" width="80" height="40" rx="8" />
            <text class="label" x="310" y="66" text-anchor="middle">
              Answer
            </text>

            <rect
              class="node model"
              x="68"
              y="128"
              width="224"
              height="56"
              rx="8"
            />
            <text
              class="label"
              x="180"
              y="162"
              text-anchor="middle"
              font-family="monospace"
            >
              {"name":"search"}
            </text>

            <rect
              class="boundary"
              x="46"
              y="222"
              width="268"
              height="150"
              rx="14"
            />
            <text class="label" x="66" y="248">Harness</text>
            <rect
              class="node tool"
              x="118"
              y="290"
              width="124"
              height="54"
              rx="10"
            />
            <text class="label" x="180" y="323" text-anchor="middle">Tool</text>
          </svg>
        </section>
        <figcaption>
          The request format changes; execution and feedback stay the same.
        </figcaption>
      </figure>
    </main>
  </body>
</html>
