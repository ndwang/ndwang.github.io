<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReAct</title>
    <link rel="stylesheet" href="./diagram.css" />
  </head>
  <body>
    <main>
      <h1>ReAct</h1>
      <figure>
        <svg
          class="visual"
          viewBox="0 0 360 440"
          role="img"
          aria-labelledby="react-title react-desc"
        >
          <title id="react-title">The original ReAct pattern</title>
          <desc id="react-desc">
            The model generates a thought and an action. Outside the model, the
            program executes a tool and returns an observation. That observation
            informs a subsequent model generation, which can continue the loop
            or answer. The thought is generated text, not direct access to the
            model's internal computation.
          </desc>
          <defs>
            <marker
              id="react-arrow"
              markerWidth="7"
              markerHeight="7"
              refX="6"
              refY="3.5"
              orient="auto"
            >
              <path class="arrow" d="M0 0 L7 3.5 L0 7 Z" />
            </marker>
          </defs>

          <rect
            class="boundary"
            x="82"
            y="16"
            width="180"
            height="182"
            rx="14"
          />
          <text class="label" x="102" y="42">Model</text>
          <rect
            class="boundary"
            x="82"
            y="222"
            width="240"
            height="202"
            rx="14"
          />
          <text class="label" x="102" y="246">Program</text>

          <path class="edge" d="M180 110 V132" marker-end="url(#react-arrow)" />
          <path class="edge" d="M180 182 V264" marker-end="url(#react-arrow)" />
          <path class="edge" d="M180 314 V358" marker-end="url(#react-arrow)" />
          <path
            class="edge"
            d="M114 384 H32 V86 H112"
            marker-end="url(#react-arrow)"
          />
          <path class="edge" d="M246 86 H270" marker-end="url(#react-arrow)" />

          <rect
            class="node model"
            x="114"
            y="62"
            width="132"
            height="48"
            rx="9"
          />
          <text class="label" x="180" y="92" text-anchor="middle">Thought</text>
          <rect
            class="node model"
            x="114"
            y="134"
            width="132"
            height="48"
            rx="9"
          />
          <text class="label" x="180" y="164" text-anchor="middle">Action</text>
          <rect
            class="node tool"
            x="114"
            y="266"
            width="132"
            height="48"
            rx="9"
          />
          <text class="label" x="180" y="296" text-anchor="middle">Tool</text>
          <rect class="node" x="114" y="360" width="132" height="48" rx="9" />
          <text class="label" x="180" y="390" text-anchor="middle">
            Observation
          </text>
          <rect class="node" x="272" y="66" width="80" height="40" rx="8" />
          <text class="label" x="312" y="92" text-anchor="middle">Answer</text>
        </svg>
      </figure>
    </main>
  </body>
</html>
