<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connecting tools</title>
    <link rel="stylesheet" href="./diagram.css" />
  </head>
  <body>
    <main>
      <h1>Connecting tools</h1>
      <div class="comparison">
        <figure>
          <h2>Custom adapters</h2>
          <svg
            class="visual"
            viewBox="0 0 360 360"
            role="img"
            aria-labelledby="custom-title custom-desc"
          >
            <title id="custom-title">Application-specific integrations</title>
            <desc id="custom-desc">
              Two applications use the same three services. A separate adapter
              is drawn on each application-to-service path, illustrating
              duplicated integration work.
            </desc>
            <g class="edge">
              <path d="M104 88 H256" />
              <path d="M104 88 L256 180" />
              <path d="M104 88 L256 272" />
              <path d="M104 272 L256 88" />
              <path d="M104 272 L256 180" />
              <path d="M104 272 H256" />
            </g>
            <g class="node">
              <rect x="168" y="79" width="24" height="18" rx="4" />
              <rect x="148" y="113" width="24" height="18" rx="4" />
              <rect x="206" y="217" width="24" height="18" rx="4" />
              <rect x="130" y="217" width="24" height="18" rx="4" />
              <rect x="132" y="239" width="24" height="18" rx="4" />
              <rect x="168" y="263" width="24" height="18" rx="4" />
            </g>
            <rect
              class="node model"
              x="4"
              y="61"
              width="100"
              height="54"
              rx="8"
            />
            <rect
              class="node model"
              x="4"
              y="245"
              width="100"
              height="54"
              rx="8"
            />
            <rect
              class="node tool"
              x="256"
              y="61"
              width="100"
              height="54"
              rx="8"
            />
            <rect
              class="node tool"
              x="256"
              y="153"
              width="100"
              height="54"
              rx="8"
            />
            <rect
              class="node tool"
              x="256"
              y="245"
              width="100"
              height="54"
              rx="8"
            />
            <g class="label" text-anchor="middle">
              <text x="54" y="94">App A</text>
              <text x="54" y="278">App B</text>
              <text x="306" y="94">GitHub</text>
              <text x="306" y="186">Slack</text>
              <text x="306" y="278">Files</text>
            </g>
          </svg>
        </figure>
        <figure>
          <h2>MCP clients and servers</h2>
          <svg
            class="visual"
            viewBox="0 0 360 360"
            role="img"
            aria-labelledby="mcp-title mcp-desc"
          >
            <title id="mcp-title">Reusable MCP interfaces</title>
            <desc id="mcp-desc">
              The same applications connect individually to the same services
              through compatible client and server interfaces. Matching green
              ports mark the shared protocol. The dashed boundary is not a
              central service, and the number of runtime connections has not
              decreased.
            </desc>
            <path class="boundary" d="M180 52 V310" />
            <text class="label" x="180" y="30" text-anchor="middle">MCP</text>
            <g class="edge">
              <path d="M124 88 H236" />
              <path d="M124 88 L236 180" />
              <path d="M124 88 L236 272" />
              <path d="M124 272 L236 88" />
              <path d="M124 272 L236 180" />
              <path d="M124 272 H236" />
            </g>
            <rect
              class="node model"
              x="4"
              y="61"
              width="100"
              height="54"
              rx="8"
            />
            <rect
              class="node model"
              x="4"
              y="245"
              width="100"
              height="54"
              rx="8"
            />
            <rect
              class="node tool"
              x="256"
              y="61"
              width="100"
              height="54"
              rx="8"
            />
            <rect
              class="node tool"
              x="256"
              y="153"
              width="100"
              height="54"
              rx="8"
            />
            <rect
              class="node tool"
              x="256"
              y="245"
              width="100"
              height="54"
              rx="8"
            />
            <g class="node harness">
              <rect x="104" y="78" width="20" height="20" rx="3" />
              <rect x="104" y="262" width="20" height="20" rx="3" />
              <rect x="236" y="78" width="20" height="20" rx="3" />
              <rect x="236" y="170" width="20" height="20" rx="3" />
              <rect x="236" y="262" width="20" height="20" rx="3" />
            </g>
            <g class="label" text-anchor="middle">
              <text x="54" y="94">App A</text>
              <text x="54" y="278">App B</text>
              <text x="306" y="94">GitHub</text>
              <text x="306" y="186">Slack</text>
              <text x="306" y="278">Files</text>
            </g>
          </svg>
        </figure>
      </div>
      <p class="sr-only">
        Small adapter blocks represent integration implementations, not running
        agents or additional services.
      </p>
      <figure>
        <figcaption>
          MCP standardizes interfaces; applications still connect to individual
          servers.
        </figcaption>
      </figure>
    </main>
  </body>
</html>
