<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Who selects the context?</title>
    <link rel="stylesheet" href="diagram.css" />
  </head>
  <body>
    <main>
      <h1>Who selects the context?</h1>
      <div class="comparison">
        <figure>
          <h2>Automatic RAG</h2>
          <svg
            class="visual"
            viewBox="0 0 360 480"
            role="img"
            aria-labelledby="rag-title rag-desc"
          >
            <title id="rag-title">Retrieval before each response</title>
            <desc id="rag-desc">
              The application sends the question through retrieval, adds
              matching document passages to context, and calls the model. The
              model does not choose when retrieval runs.
            </desc>
            <defs>
              <marker
                id="rag-arrow"
                viewBox="0 0 10 10"
                refX="8"
                refY="5"
                markerWidth="6"
                markerHeight="6"
                orient="auto-start-reverse"
              >
                <path class="arrow" d="M1 1 L9 5 L1 9 Z" />
              </marker>
            </defs>
            <path class="edge" d="M150 66 V106" marker-end="url(#rag-arrow)" />
            <path class="edge" d="M150 156 V214" marker-end="url(#rag-arrow)" />
            <path class="edge" d="M150 284 V330" marker-end="url(#rag-arrow)" />
            <path class="edge" d="M150 380 V422" marker-end="url(#rag-arrow)" />
            <path class="edge" d="M250 132 H232" marker-end="url(#rag-arrow)" />
            <rect class="node" x="70" y="18" width="160" height="48" rx="8" />
            <text class="label" x="150" y="48" text-anchor="middle">
              Question
            </text>
            <rect
              class="node tool"
              x="70"
              y="108"
              width="160"
              height="48"
              rx="8"
            />
            <text class="label" x="150" y="138" text-anchor="middle">
              Retrieval
            </text>
            <path
              class="node"
              d="M250 108 H328 L350 130 V156 H250 Z M328 108 V130 H350"
            />
            <text class="label" x="300" y="140" text-anchor="middle">Docs</text>
            <rect
              class="node harness"
              x="70"
              y="216"
              width="160"
              height="68"
              rx="8"
            />
            <text class="label" x="150" y="244" text-anchor="middle">
              Context
            </text>
            <path class="edge" d="M96 260 H204 M96 270 H176" />
            <rect
              class="node model"
              x="70"
              y="332"
              width="160"
              height="48"
              rx="8"
            />
            <text class="label" x="150" y="362" text-anchor="middle">
              Model
            </text>
            <rect class="node" x="70" y="424" width="160" height="48" rx="8" />
            <text class="label" x="150" y="454" text-anchor="middle">
              Answer
            </text>
          </svg>
        </figure>
        <figure>
          <h2>Agent-directed search</h2>
          <svg
            class="visual"
            viewBox="0 0 360 480"
            role="img"
            aria-labelledby="search-title search-desc"
          >
            <title id="search-title">
              The model chooses when to gather information
            </title>
            <desc id="search-desc">
              The model can request a search of files and use returned
              information in its next step. It can repeat that loop or answer.
              Tool execution is handled by the harness, omitted here to
              emphasize who schedules retrieval.
            </desc>
            <defs>
              <marker
                id="search-arrow"
                viewBox="0 0 10 10"
                refX="8"
                refY="5"
                markerWidth="6"
                markerHeight="6"
                orient="auto-start-reverse"
              >
                <path class="arrow" d="M1 1 L9 5 L1 9 Z" />
              </marker>
            </defs>
            <path
              class="edge"
              d="M180 66 V108"
              marker-end="url(#search-arrow)"
            />
            <path
              class="edge"
              d="M110 138 H85 V263"
              marker-end="url(#search-arrow)"
            />
            <path
              class="edge"
              d="M150 293 H208"
              marker-end="url(#search-arrow)"
            />
            <path
              class="edge"
              d="M340 293 H352 V138 H252"
              marker-end="url(#search-arrow)"
            />
            <path
              class="edge"
              d="M110 126 H8 V448 H98"
              marker-end="url(#search-arrow)"
            />
            <rect class="node" x="100" y="18" width="160" height="48" rx="8" />
            <text class="label" x="180" y="48" text-anchor="middle">
              Question
            </text>
            <rect
              class="node model"
              x="110"
              y="110"
              width="140"
              height="56"
              rx="8"
            />
            <text class="label" x="180" y="144" text-anchor="middle">
              Model
            </text>
            <rect
              class="node tool"
              x="20"
              y="265"
              width="130"
              height="56"
              rx="8"
            />
            <text class="label" x="85" y="299" text-anchor="middle">
              Search
            </text>
            <path
              class="node"
              d="M210 265 H318 L340 287 V321 H210 Z M318 265 V287 H340"
            />
            <text class="label" x="275" y="302" text-anchor="middle">
              Files
            </text>
            <rect class="node" x="100" y="424" width="160" height="48" rx="8" />
            <text class="label" x="180" y="454" text-anchor="middle">
              Answer
            </text>
          </svg>
        </figure>
      </div>
    </main>
  </body>
</html>
