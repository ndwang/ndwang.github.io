<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Who chooses the next step?</title>
    <link rel="stylesheet" href="./diagram.css" />
  </head>
  <body>
    <main>
      <h1>Who chooses the next step?</h1>
      <figure>
        <div class="comparison">
          <section aria-labelledby="workflow-title">
            <h2 id="workflow-title">Prescribed workflow</h2>
            <svg
              class="visual"
              viewBox="0 0 360 510"
              role="img"
              aria-labelledby="workflow-svg-title workflow-desc"
            >
              <title id="workflow-svg-title">
                A developer-defined order-status workflow
              </title>
              <desc id="workflow-desc">
                A customer asks for the status of order 42. The application
                prescribes classification, extraction of the order ID, an
                external order lookup, and response drafting. The lookup result
                is supplied to the model before it drafts an answer. Validation
                and recovery are omitted to focus on the sequence.
              </desc>
              <defs>
                <marker
                  id="workflow-arrow"
                  viewBox="0 0 8 8"
                  refX="7"
                  refY="4"
                  markerWidth="6"
                  markerHeight="6"
                  orient="auto-start-reverse"
                >
                  <path class="arrow" d="M0 0 8 4 0 8Z" />
                </marker>
              </defs>
              <path
                class="edge"
                d="M180 68V102"
                marker-end="url(#workflow-arrow)"
              />
              <path
                class="edge"
                d="M180 150V184"
                marker-end="url(#workflow-arrow)"
              />
              <path
                class="edge"
                d="M180 232V266"
                marker-end="url(#workflow-arrow)"
              />
              <path
                class="edge"
                d="M180 314V348"
                marker-end="url(#workflow-arrow)"
              />
              <path
                class="edge"
                d="M180 396V430"
                marker-end="url(#workflow-arrow)"
              />
              <rect class="node" x="70" y="20" width="220" height="48" rx="9" />
              <text
                class="label"
                x="180"
                y="44"
                text-anchor="middle"
                dominant-baseline="central"
              >
                Order #42?
              </text>
              <rect
                class="node model"
                x="70"
                y="102"
                width="220"
                height="48"
                rx="9"
              />
              <text
                class="label"
                x="180"
                y="126"
                text-anchor="middle"
                dominant-baseline="central"
              >
                Classify
              </text>
              <rect
                class="node model"
                x="70"
                y="184"
                width="220"
                height="48"
                rx="9"
              />
              <text
                class="label"
                x="180"
                y="208"
                text-anchor="middle"
                dominant-baseline="central"
              >
                Extract ID
              </text>
              <rect
                class="node tool"
                x="70"
                y="266"
                width="220"
                height="48"
                rx="9"
              />
              <text
                class="label"
                x="180"
                y="290"
                text-anchor="middle"
                dominant-baseline="central"
              >
                Order lookup
              </text>
              <rect
                class="node model"
                x="70"
                y="348"
                width="220"
                height="48"
                rx="9"
              />
              <text
                class="label"
                x="180"
                y="372"
                text-anchor="middle"
                dominant-baseline="central"
              >
                Draft reply
              </text>
              <rect
                class="node"
                x="70"
                y="430"
                width="220"
                height="48"
                rx="9"
              />
              <text
                class="label"
                x="180"
                y="454"
                text-anchor="middle"
                dominant-baseline="central"
              >
                Answer
              </text>
            </svg>
          </section>
          <section aria-labelledby="loop-title">
            <h2 id="loop-title">Model-directed loop</h2>
            <svg
              class="visual"
              viewBox="0 0 360 510"
              role="img"
              aria-labelledby="loop-svg-title loop-desc"
            >
              <title id="loop-svg-title">
                A model-directed order-status loop
              </title>
              <desc id="loop-desc">
                The same customer asks for order 42 using the same order data.
                The model decides to request an order lookup. The harness
                executes the lookup and returns its result for a subsequent
                model generation. The model can request another lookup or
                generate an answer. The diagram shows a control loop, not one
                model call; execution details are omitted here.
              </desc>
              <defs>
                <marker
                  id="loop-arrow"
                  viewBox="0 0 8 8"
                  refX="7"
                  refY="4"
                  markerWidth="6"
                  markerHeight="6"
                  orient="auto-start-reverse"
                >
                  <path class="arrow" d="M0 0 8 4 0 8Z" />
                </marker>
              </defs>
              <path
                class="edge"
                d="M180 68V130"
                marker-end="url(#loop-arrow)"
              />
              <path
                class="edge"
                d="M155 194V266"
                marker-end="url(#loop-arrow)"
              />
              <path
                class="edge"
                d="M290 290H325V162H250"
                marker-end="url(#loop-arrow)"
              />
              <path
                class="edge"
                d="M110 162H35V454H70"
                marker-end="url(#loop-arrow)"
              />
              <rect class="node" x="70" y="20" width="220" height="48" rx="9" />
              <text
                class="label"
                x="180"
                y="44"
                text-anchor="middle"
                dominant-baseline="central"
              >
                Order #42?
              </text>
              <rect
                class="node model"
                x="110"
                y="130"
                width="140"
                height="64"
                rx="10"
              />
              <text
                class="label"
                x="180"
                y="162"
                text-anchor="middle"
                dominant-baseline="central"
              >
                Model
              </text>
              <rect
                class="node tool"
                x="70"
                y="266"
                width="220"
                height="48"
                rx="9"
              />
              <text
                class="label"
                x="180"
                y="290"
                text-anchor="middle"
                dominant-baseline="central"
              >
                Order lookup
              </text>
              <rect
                class="node"
                x="70"
                y="430"
                width="220"
                height="48"
                rx="9"
              />
              <text
                class="label"
                x="180"
                y="454"
                text-anchor="middle"
                dominant-baseline="central"
              >
                Answer
              </text>
            </svg>
          </section>
        </div>
        <figcaption>
          The same task and data, with control in the prescribed sequence or the
          model's next decision.
        </figcaption>
      </figure>
    </main>
  </body>
</html>
