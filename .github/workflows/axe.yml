name: Axe accessibility testing

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Relative page path (leave blank to check all five main pages)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Set up Chrome and ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Check accessibility
        env:
          PAGE_PATH: ${{ inputs.url }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          npm run preview -- --port 4321 > "$RUNNER_TEMP/astro-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4321/ > /dev/null

          if [[ -n "$PAGE_PATH" ]]; then
            urls=("http://127.0.0.1:4321/${PAGE_PATH#/}")
          else
            urls=(
              http://127.0.0.1:4321/
              http://127.0.0.1:4321/papers/
              http://127.0.0.1:4321/blog/
              http://127.0.0.1:4321/projects/
              http://127.0.0.1:4321/cv/
            )
          fi
          npx --yes @axe-core/cli@4 "${urls[@]}" \
            --chrome-path "$CHROME_PATH" \
            --chromedriver-path "$CHROMEDRIVER_PATH" \
            --exit
